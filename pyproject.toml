[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phage-annotator"
version = "1.0.1"
description = "General keypoint annotation GUI for 2D/3D/time microscopy, with a phage preset"
authors = [
  { name = "Chandrasekar Subramani Narayana" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "click>=8.1",
  "pyqt5>=5.15",
  "tifffile>=2024.1.0",
  "scipy>=1.13",
  "lmfit>=1.3",
  "scikit-learn>=1.3",
  "scikit-image>=0.22",
  "qtawesome>=1.4",
  "simpleicons>=7.21",
]

[project.scripts]
phage-annotator = "phage_annotator.cli:main"
phage-annotator-smlm-parity = "phage_annotator.smlm.parity_cli:main"
phage-annotator-smlm-preflight = "phage_annotator.smlm.preflight_cli:main"
phage-annotator-smlm-run-demo = "phage_annotator.smlm.demo_cli:main"
phage-annotator-fiji-plugin-tool = "phage_annotator.smlm.external_plugins_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-qt>=4.4",
  "pytest-benchmark>=4.0",
  "zstandard>=0.22",
]
cache = [
  "zstandard>=0.22",
]
fiji = [
  "pyimagej>=1.5",
  "jpype1>=1.5",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "gui: GUI tests that require a Qt backend (run under Xvfb in CI)",
  "benchmark: performance benchmark tests requiring pytest-benchmark",
  "integration: optional end-to-end integration tests requiring external runtime dependencies",
  "order: execution-order marker used by selected test modules",
]

[tool.coverage.run]
branch = true
source = ["src/phage_annotator"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
