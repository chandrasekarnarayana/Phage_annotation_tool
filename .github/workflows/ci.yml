name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONWARNINGS: default
  MPLBACKEND: Agg
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy
      - name: Ruff (blocking correctness)
        run: ruff check src tests --select E9,F63,F7,F82
      - name: Ruff (maintained test/style surface)
        run: >
          ruff check
          tests/conftest.py
          tests/unit/annotation/test_multi_modality_annotations.py
          tests/unit/session/test_projection_ui_logic.py
          tests/integration/gui/test_projection_ui_wiring.py
          tests/unit/ui_qt/test_sidebar_manager.py
          tests/integration/test_sync_propagation_integration.py
          tests/unit/data/test_sync_rules.py
      - name: Mypy (core)
        run: >
          mypy --ignore-missing-imports --follow-imports=skip
          src/phage_annotator/io/readers/base.py
          src/phage_annotator/algorithms/analysis.py
          src/phage_annotator/annotation/core.py
          src/phage_annotator/io/projects/base.py
          src/phage_annotator/cache/projection_cache.py
          src/phage_annotator/data/pyramid.py
          src/phage_annotator/data/ring_buffer.py
      - name: Import integrity check
        run: python scripts/check_import_integrity.py
      - name: Package layout check
        run: python scripts/check_package_layout.py
      - name: Source quality check
        run: python scripts/check_source_quality.py
      - name: Core Qt import guard
        run: python scripts/check_core_no_qt.py
      - name: Acyclic import check (layer enforcement)
        run: python scripts/check_acyclic_imports.py --verbose
      - name: Test layout guard (no root-level tests)
        run: |
          python - <<'PY'
          from pathlib import Path
          root_tests = sorted(p.name for p in Path("tests").glob("test_*.py"))
          if root_tests:
              raise SystemExit(
                  "Root-level tests are not allowed. Move these files into unit/, integration/, "
                  f"or integration/gui/: {root_tests}"
              )
          print("Test layout guard passed.")
          PY
      - name: Release hygiene guard
        run: python scripts/check_release_hygiene.py
      - name: Root cleanliness guard
        run: python scripts/check_root_cleanliness.py
      - name: Markdown quality guard
        run: python scripts/check_markdown_quality.py
      - name: Console scripts declaration guard
        run: python -m pytest -q tests/unit/test_cli_entrypoints.py

  test-core:
    name: Core Tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev,cache]
      - name: Verify benchmark plugin availability
        run: python -c "import pytest_benchmark; print('pytest-benchmark', pytest_benchmark.__version__)"
      - name: Prepare artifacts dir
        run: python -c "import pathlib; pathlib.Path('artifacts').mkdir(exist_ok=True)"
      - name: Diagnostics
        run: |
          python -c "import sys,platform; print(sys.version); print(platform.platform())"
          python -c "import matplotlib; print('matplotlib', matplotlib.get_backend())"
          python -c "import pkgutil; print('PyQt5', 'available' if pkgutil.find_loader('PyQt5') else 'not available')"
      - name: Run core tests
        run: >
          python -m pytest -m "not gui"
          --cov=src/phage_annotator
          --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml:artifacts/coverage-core.xml
          --junitxml=artifacts/junit-core.xml
          --log-file=artifacts/pytest-core.log
          --durations=10
      - name: Upload core artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-artifacts-${{ matrix.os }}-py${{ matrix.python-version }}
          path: artifacts

  test-gui:
    name: GUI Tests (ubuntu-22.04 / py3.11)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev,cache]
      - name: Verify benchmark plugin availability
        run: python -c "import pytest_benchmark; print('pytest-benchmark', pytest_benchmark.__version__)"
      - name: Prepare artifacts dir
        run: python -c "import pathlib; pathlib.Path('artifacts').mkdir(exist_ok=True)"
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Diagnostics
        run: |
          python -c "import sys,platform; print(sys.version); print(platform.platform())"
          python -c "import matplotlib; print('matplotlib', matplotlib.get_backend())"
          python -c "import pkgutil; print('PyQt5', 'available' if pkgutil.find_loader('PyQt5') else 'not available')"
      - name: Run GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: >
          xvfb-run -a python -m pytest -m gui --run-gui
          --junitxml=artifacts/junit-gui.xml
          --log-file=artifacts/pytest-gui.log
          --durations=10
      - name: GUI execution gate (no all-skipped pass)
        run: python scripts/check_junit_executed.py artifacts/junit-gui.xml --min-executed 1
      - name: Upload GUI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-artifacts-ubuntu-22.04-py3.11
          path: artifacts

  test-gui-ux-state:
    name: GUI UX State Tests (ubuntu-22.04 / py3.11)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev,cache]
      - name: Prepare artifacts dir
        run: python -c "import pathlib; pathlib.Path('artifacts').mkdir(exist_ok=True)"
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run GUI UX state tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: >
          xvfb-run -a python -m pytest --run-gui
          tests/integration/gui/test_ui_wiring.py
          -k "advanced_analysis_toggle_syncs_visibility_and_menu_state or
              command_palette_weighting_usage_and_mode_boost or
              assist_expert_preset_expected_visibility_set or
              open_training_controls_routes_to_preferences or
              layout_preset_action_fires_once or
              overlay_toggle_action_fires_once or
              reset_layout_action_fires_once or
              smlm_preflight_fixit_card_wiring or
              smlm_plugin_dropdown_hides_internal_profiles"
          --junitxml=artifacts/junit-gui-ux-state.xml
          --log-file=artifacts/pytest-gui-ux-state.log
      - name: GUI UX execution gate (no all-skipped pass)
        run: python scripts/check_junit_executed.py artifacts/junit-gui-ux-state.xml --min-executed 1
      - name: Upload GUI UX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-ux-state-artifacts-ubuntu-22.04-py3.11
          path: artifacts

  test-performance-gate:
    name: Performance/SLO Gate (ubuntu-22.04 / py3.11)
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev,cache]
      - name: Prepare artifacts dir
        run: python -c "import pathlib; pathlib.Path('artifacts').mkdir(exist_ok=True)"
      - name: Run performance/SLO tests with benchmark output
        run: >
          python -m pytest
          tests/performance/test_perf.py
          tests/unit/ui_qt/test_bcontrast_performance.py::TestDisplayMappingPerformance::test_display_mapping_creation
          tests/unit/ui_qt/test_bcontrast_performance.py::TestDisplayMappingPerformance::test_display_mapping_update
          tests/integration/test_integration_large_stacks.py::TestPerformanceAgainstSLO
          --benchmark-json=artifacts/benchmark-gate.json
          --junitxml=artifacts/junit-performance-gate.xml
          --log-file=artifacts/pytest-performance-gate.log
          --durations=10
      - name: Benchmark threshold gate
        run: >
          python scripts/check_benchmark_thresholds.py
          artifacts/benchmark-gate.json
          tests/performance/benchmark_thresholds.json
      - name: Benchmark trend report (vs baseline)
        run: >
          python scripts/compare_benchmark_baseline.py
          artifacts/benchmark-gate.json
          tests/performance/benchmark_baseline.json
          --output artifacts/benchmark-trend.md
      - name: Performance execution gate (no all-skipped pass)
        run: python scripts/check_junit_executed.py artifacts/junit-performance-gate.xml --min-executed 1
      - name: Upload performance gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-gate-artifacts-ubuntu-22.04-py3.11
          path: artifacts

  ci-summary:
    name: CI Summary Artifact
    runs-on: ubuntu-22.04
    needs: [test-gui, test-gui-ux-state, test-performance-gate]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts_download
      - name: Build summary markdown
        run: >
          python scripts/build_ci_summary.py
          --artifacts-dir artifacts_download
          --thresholds tests/performance/benchmark_thresholds.json
          --output artifacts/ci-summary.md
      - name: Upload CI summary
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: artifacts/ci-summary.md

  test-ml-optional:
    name: ML Optional Deps (ubuntu-22.04 / py3.11)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test deps with ML extras (CPU torch + onnxruntime)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,cache,ml]"
      - name: Verify ML dependencies installed
        run: |
          python -c "import torch; print('torch', torch.__version__)"
          python -c "import onnxruntime as ort; print('onnxruntime', ort.__version__)"
          python -c "from phage_annotator.algorithms.onnx_infer import is_onnxruntime_available; assert is_onnxruntime_available()"
          python -c "from phage_annotator.algorithms.deepstorm_infer import is_torch_available; assert is_torch_available()"
      - name: Prepare artifacts dir
        run: python -c "import pathlib; pathlib.Path('artifacts').mkdir(exist_ok=True)"
      - name: Run ML-related unit tests (with real deps, no model files)
        run: >
          python -m pytest
          tests/unit/algorithms/test_onnx_infer.py
          tests/unit/algorithms/test_deepstorm_infer.py
          tests/unit/smlm/test_platform_utils.py
          -v
          --junitxml=artifacts/junit-ml-optional.xml
          --log-file=artifacts/pytest-ml-optional.log
      - name: Upload ML optional artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-optional-artifacts-ubuntu-22.04-py3.11
          path: artifacts

  test-fiji-integration:
    name: Fiji Integration Tests (optional)
    if: ${{ vars.FIJI_APP_PATH != '' && vars.FIJI_EXE_PATH != '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      FIJI_APP_PATH: ${{ vars.FIJI_APP_PATH }}
      FIJI_EXE_PATH: ${{ vars.FIJI_EXE_PATH }}
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev,cache]
      - name: Prepare artifacts dir
        run: python -c "import pathlib; pathlib.Path('artifacts').mkdir(exist_ok=True)"
      - name: Preflight probe
        run: >
          python -m phage_annotator.smlm.preflight_cli
          --backend fiji_subprocess
          --plugin-id thunder_storm
          --fiji-exe "$FIJI_EXE_PATH"
          --probe
      - name: Demo runner smoke test
        run: >
          python -m phage_annotator.smlm.demo_cli
          --backend fiji_subprocess
          --plugin-id thunder_storm
          --fiji-exe "$FIJI_EXE_PATH"
          --out-dir artifacts/fiji_demo
          --probe-first
      - name: Run optional Fiji integration tests
        run: >
          python -m pytest -m integration
          tests/integration/test_fiji_thunderstorm.py
          --junitxml=artifacts/junit-fiji-integration.xml
          --log-file=artifacts/pytest-fiji-integration.log
      - name: Fiji integration summary
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path("artifacts/fiji_demo/run_manifest.json")
          if manifest.exists():
              print("Probe OK + Demo OK")
              print(manifest.read_text(encoding="utf-8"))
          else:
              print("Demo manifest missing")
          PY
      - name: Upload Fiji integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiji-integration-artifacts-ubuntu-22.04-py3.11
          path: artifacts

  docker:
    name: Docker Image Build & Smoke Test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -t phage-annotator:ci .
      - name: Smoke-test CLI entrypoint
        run: docker run --rm phage-annotator:ci --help
      - name: Build test image (dev extras)
        run: docker build --build-arg EXTRAS=dev,cache -t phage-annotator:ci-test .
      - name: Run core test suite inside the isolated image
        run: >
          docker run --rm
          -e QT_QPA_PLATFORM=offscreen
          -e MPLBACKEND=Agg
          --entrypoint python
          -w /app
          phage-annotator:ci-test
          -m pytest -m "not gui" -q

  build:
    name: Build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build sdist/wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Smoke-test wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python - <<'PY'
          import phage_annotator
          from phage_annotator import io
          from phage_annotator.annotation import core as annotation_core
          from phage_annotator.algorithms.onnx_infer import is_onnxruntime_available
          from phage_annotator.algorithms.deepstorm_infer import is_torch_available
          from phage_annotator.smlm.platform_utils import fiji_executable_placeholder
          assert phage_annotator.__version__ == "1.1.0", f"Unexpected version: {phage_annotator.__version__}"
          print("import ok", phage_annotator.__version__)
          print("io", io.__name__, "annotation_core", annotation_core.__name__)
          print("onnxruntime available:", is_onnxruntime_available())
          print("torch available:", is_torch_available())
          print("fiji placeholder:", fiji_executable_placeholder())
          PY
