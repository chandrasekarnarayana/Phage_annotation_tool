name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONWARNINGS: default
  MPLBACKEND: Agg
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy
      - name: Ruff (blocking correctness)
        run: ruff check src tests --select E9,F63,F7,F82
      - name: Ruff (maintained test/style surface)
        run: >
          ruff check
          tests/conftest.py
          tests/unit/annotation/test_multi_modality_annotations.py
          tests/unit/session/test_projection_ui_logic.py
          tests/integration/gui/test_projection_ui_wiring.py
          tests/unit/ui_qt/test_sidebar_manager.py
          tests/integration/test_sync_propagation_integration.py
          tests/unit/data/test_sync_rules.py
      - name: Mypy (core)
        run: >
          mypy --ignore-missing-imports --follow-imports=skip
          src/phage_annotator/io/readers/base.py
          src/phage_annotator/algorithms/analysis.py
          src/phage_annotator/annotation/core.py
          src/phage_annotator/io/projects/base.py
          src/phage_annotator/cache/projection_cache.py
          src/phage_annotator/data/pyramid.py
          src/phage_annotator/data/ring_buffer.py
      - name: Import integrity check
        run: python scripts/check_import_integrity.py
      - name: Package layout check
        run: python scripts/check_package_layout.py
      - name: Core Qt import guard
        run: python scripts/check_core_no_qt.py
      - name: Acyclic import check (layer enforcement)
        run: python scripts/check_acyclic_imports.py --verbose
      - name: Test layout guard (no root-level tests)
        run: |
          python - <<'PY'
          from pathlib import Path
          root_tests = sorted(p.name for p in Path("tests").glob("test_*.py"))
          if root_tests:
              raise SystemExit(
                  "Root-level tests are not allowed. Move these files into unit/, integration/, "
                  f"or integration/gui/: {root_tests}"
              )
          print("Test layout guard passed.")
          PY

  test-core:
    name: Core Tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
      - name: Prepare artifacts dir
        run: python -c "import pathlib; pathlib.Path('artifacts').mkdir(exist_ok=True)"
      - name: Diagnostics
        run: |
          python -c "import sys,platform; print(sys.version); print(platform.platform())"
          python -c "import matplotlib; print('matplotlib', matplotlib.get_backend())"
          python -c "import pkgutil; print('PyQt5', 'available' if pkgutil.find_loader('PyQt5') else 'not available')"
      - name: Run core tests
        run: >
          python -m pytest -m "not gui"
          --cov=src/phage_annotator
          --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml:artifacts/coverage-core.xml
          --junitxml=artifacts/junit-core.xml
          --log-file=artifacts/pytest-core.log
          --durations=10
      - name: Upload core artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-artifacts-${{ matrix.os }}-py${{ matrix.python-version }}
          path: artifacts

  test-gui:
    name: GUI Tests (ubuntu-22.04 / py3.11)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
      - name: Prepare artifacts dir
        run: python -c "import pathlib; pathlib.Path('artifacts').mkdir(exist_ok=True)"
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Diagnostics
        run: |
          python -c "import sys,platform; print(sys.version); print(platform.platform())"
          python -c "import matplotlib; print('matplotlib', matplotlib.get_backend())"
          python -c "import pkgutil; print('PyQt5', 'available' if pkgutil.find_loader('PyQt5') else 'not available')"
      - name: Run GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: >
          xvfb-run -a python -m pytest -m gui --run-gui
          --junitxml=artifacts/junit-gui.xml
          --log-file=artifacts/pytest-gui.log
          --durations=10
      - name: Upload GUI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-artifacts-ubuntu-22.04-py3.11
          path: artifacts

  test-gui-ux-state:
    name: GUI UX State Tests (ubuntu-22.04 / py3.11)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
      - name: Prepare artifacts dir
        run: python -c "import pathlib; pathlib.Path('artifacts').mkdir(exist_ok=True)"
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run GUI UX state tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: >
          xvfb-run -a python -m pytest --run-gui
          tests/integration/gui/test_ui_wiring.py
          -k "advanced_analysis_toggle_syncs_visibility_and_menu_state or
              command_palette_weighting_usage_and_mode_boost or
              assist_expert_preset_expected_visibility_set or
              open_training_controls_routes_to_preferences or
              layout_preset_action_fires_once or
              overlay_toggle_action_fires_once or
              reset_layout_action_fires_once"
          --junitxml=artifacts/junit-gui-ux-state.xml
          --log-file=artifacts/pytest-gui-ux-state.log
      - name: Upload GUI UX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-ux-state-artifacts-ubuntu-22.04-py3.11
          path: artifacts

  build:
    name: Build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build sdist/wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Smoke-test wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python - <<'PY'
          import phage_annotator
          from phage_annotator import io
          from phage_annotator.annotation import core as annotation_core
          print("import ok", phage_annotator.__version__)
          print("io", io.__name__, "annotation_core", annotation_core.__name__)
          PY
